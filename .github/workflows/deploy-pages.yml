name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # index.html loads dist/main.js relative to the page, but dist/ is
      # gitignored (it's a build artifact) — so the published site needs its
      # own copy that only includes what the browser actually fetches, not
      # the whole repo (no node_modules, src, etc.).
      - name: Assemble static site
        run: |
          mkdir -p _site/dist
          cp index.html styles.css _site/
          cp -r dist/. _site/dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
